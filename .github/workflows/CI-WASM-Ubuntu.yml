name: CI-WASM-Ubuntu

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      # The build helper is one binary, so this host compiles all of it, but it only runs the WASM
      # module: a change to another target's module is for that target's workflow.
      - 'xtask/**'
      - '!xtask/src/targets/android.rs'
      - '!xtask/src/targets/ios.rs'
      - '!xtask/src/targets/ohos.rs'
      - '.github/workflows/CI-WASM-Ubuntu.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Emscripten, the same toolchain DynXX builds its wasm target with. Nothing here depends on the
# host, so a single runner is enough.
#
# The network module is left out of this target: it needs a socket stack and a native TLS backend
# that wasm does not have, which is why DynXX leaves curl out of its Emscripten build as well.
# Every other module (crypto, SQLite, key-value, zip, Lua, JS) is built here.

jobs:
  wasm:
    name: wasm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-emscripten

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: 6.0.9

      - name: Detect libclang path
        shell: bash
        run: |
          set -euo pipefail
          dir="$(llvm-config --libdir 2>/dev/null || true)"
          if [ -z "${dir}" ] || [ ! -e "${dir}/libclang.so" ]; then
            dir="$(ls -d /usr/lib/llvm-*/lib 2>/dev/null | sort -V | tail -n1 || true)"
          fi
          if [ -n "${dir}" ] && [ -e "${dir}/libclang.so" ]; then
            echo "LIBCLANG_PATH=${dir}" >> "${GITHUB_ENV}"
            echo "LIBCLANG_PATH=${dir}"
          else
            echo "::warning::libclang.so not found, bindgen falls back to its own search"
          fi

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-wasm-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-wasm-cargo-

      # That the C is compiled by the clang of the SDK, that the sysroot of its headers reaches
      # bindgen, and that a `.wasm` module is built as a `cdylib` are all handled by the build
      # helper; see `xtask/src/targets/wasm.rs`.
      - name: Build
        run: cargo xtask build --target wasm --release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WASM-Ubuntu-build
          path: target/wasm32-unknown-emscripten/release/*.wasm
          if-no-files-found: error
