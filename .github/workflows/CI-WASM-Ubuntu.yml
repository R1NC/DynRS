name: CI-WASM-Ubuntu

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/CI-WASM-Ubuntu.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/CI-WASM-Ubuntu.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Emscripten, the same toolchain DynXX builds its wasm target with. Nothing here depends on the
# host, so a single runner is enough.
#
# The network module is left out of this target: it needs a socket stack and a native TLS backend
# that wasm does not have, which is why DynXX leaves curl out of its Emscripten build as well.
# Every other module (crypto, SQLite, key-value, zip, Lua, JS) is built here.

jobs:
  wasm:
    name: wasm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-emscripten

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: 6.0.9

      # emcc decides which wasm-opt flags to pass, so both have to come from the same SDK. The
      # versions are printed here so a mismatch is not a mystery in the log.
      - name: Show the Emscripten versions
        shell: bash
        run: |
          set -euo pipefail
          emcc --version | head -n1
          if [ -x "${EMSDK}/upstream/bin/wasm-opt" ]; then
            "${EMSDK}/upstream/bin/wasm-opt" --version
          else
            echo "this SDK has no wasm-opt"
          fi

      # `libquickjs-ng-sys` always compiles with plain clang (it ignores `CC`), and bindgen parses
      # the QuickJS headers with libclang, so both have to be pointed at the C headers of the
      # target instead of the host ones.
      - name: Point clang and bindgen at the Emscripten sysroot
        shell: bash
        run: |
          set -euo pipefail
          sysroot=""
          for candidate in "${EMSDK}/upstream/emscripten/cache/sysroot" "${EMSDK}/upstream/emscripten/system"; do
            if [ -f "${candidate}/include/stdio.h" ]; then
              sysroot="${candidate}"
              break
            fi
          done
          if [ -z "${sysroot}" ]; then
            echo "::error::no Emscripten sysroot was found"
            exit 1
          fi
          {
            echo "BINDGEN_EXTRA_CLANG_ARGS_wasm32_unknown_emscripten=--sysroot=${sysroot}"
            echo "CFLAGS_wasm32_unknown_emscripten=--sysroot=${sysroot}"
          } >> "${GITHUB_ENV}"
          echo "sysroot=${sysroot}"

      - name: Detect libclang path
        shell: bash
        run: |
          set -euo pipefail
          dir="$(llvm-config --libdir 2>/dev/null || true)"
          if [ -z "${dir}" ] || [ ! -e "${dir}/libclang.so" ]; then
            dir="$(ls -d /usr/lib/llvm-*/lib 2>/dev/null | sort -V | tail -n1 || true)"
          fi
          if [ -n "${dir}" ] && [ -e "${dir}/libclang.so" ]; then
            echo "LIBCLANG_PATH=${dir}" >> "${GITHUB_ENV}"
            echo "LIBCLANG_PATH=${dir}"
          else
            echo "::warning::libclang.so not found, bindgen falls back to its own search"
          fi

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-wasm-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-wasm-cargo-

      # The vendored C (SQLite, Lua, QuickJS, zlib) has to be compiled with the Emscripten wrappers
      # instead of the host toolchain.
      #
      # A `.wasm` module is a cdylib, while the manifest ships a static library for every other
      # target, so this run changes the manifest. Asking cargo for the crate type on the command
      # line is not an option: `cargo rustc --crate-type` also applies it to the dependencies, and
      # Emscripten then tries to link every one of them as its own side module.
      - name: Build
        shell: bash
        env:
          CC_wasm32_unknown_emscripten: emcc
          AR_wasm32_unknown_emscripten: emar
        run: |
          set -euo pipefail
          sed -i 's/crate-type = \["staticlib"\]/crate-type = ["cdylib"]/' Cargo.toml
          grep -n 'crate-type' Cargo.toml
          cargo build --release --lib --locked --target wasm32-unknown-emscripten

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WASM-Ubuntu-build
          path: target/wasm32-unknown-emscripten/release/*.wasm
          if-no-files-found: error
