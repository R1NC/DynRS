name: CI-Linux-Ubuntu

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'rust-toolchain.toml'
      # The build helper is one binary, so this host compiles all of it, but it only runs `report`
      # and `site`: a change to a target module is for that target's workflow, and `Common`
      # type-checks them.
      - 'xtask/**'
      - '!xtask/src/targets/android.rs'
      - '!xtask/src/targets/ios.rs'
      - '!xtask/src/targets/ohos.rs'
      - '!xtask/src/targets/wasm.rs'
      - '.github/pages/**'
      - '.github/workflows/CI-Linux-Ubuntu.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# The reports of this host are the ones that get published, so its deploys are serialized.
concurrency:
  group: "pages"
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  linux:
    name: linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Detect libclang path
        shell: bash
        run: |
          set -euo pipefail
          dir="$(llvm-config --libdir 2>/dev/null || true)"
          if [ -z "${dir}" ] || [ ! -e "${dir}/libclang.so" ]; then
            dir="$(ls -d /usr/lib/llvm-*/lib 2>/dev/null | sort -V | tail -n1 || true)"
          fi
          if [ -n "${dir}" ] && [ -e "${dir}/libclang.so" ]; then
            echo "LIBCLANG_PATH=${dir}" >> "${GITHUB_ENV}"
            echo "LIBCLANG_PATH=${dir}"
          else
            echo "::warning::libclang.so not found, bindgen falls back to its own search"
          fi

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Build
        run: cargo build --verbose --locked

      # `cargo llvm-cov` is the Rust side of the same LLVM coverage that the C++ DynXX uses. The
      # helper runs it and renders the unit test report, and holds the coverage to a floor.
      - name: Test
        run: cargo xtask report --fail-under-lines 80

      # What people download from a run: the release static library and the qjsc compiler.
      - name: Build release artifacts
        run: cargo build --release --verbose --locked

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Linux-Ubuntu-build
          path: |
            target/release/libdynrs.a
            target/release/qjsc
          if-no-files-found: error

      # Every host keeps its reports; only this one publishes them, the way DynXX publishes its
      # coverage and unit test reports from its Linux job.
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: Linux-Ubuntu-reports
          path: |
            coverage/
            test-report.html
          if-no-files-found: error

      # The API reference of the crate: the `ngenrs_*` C ABI, the Lua bridge and the JS bridge all
      # carry rustdoc comments, so one `cargo doc` covers them.
      - name: Generate API docs
        if: github.ref == 'refs/heads/main'
        run: cargo doc --locked --no-deps

      - name: Setup Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6

      - name: Prepare Pages site
        if: github.ref == 'refs/heads/main'
        run: cargo xtask site --output "${RUNNER_TEMP}/pages-site"

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/pages-site

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/deploy-pages@v5
