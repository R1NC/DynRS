name: CI-macOS-Mac

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'rust-toolchain.toml'
      - '.github/workflows/CI-macOS-Mac.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'rust-toolchain.toml'
      - '.github/workflows/CI-macOS-Mac.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: macos
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Detect libclang path
        shell: bash
        run: |
          set -euo pipefail
          dir="$(cd "$(dirname "$(xcrun --find clang)")/../lib" && pwd)"
          if [ ! -e "${dir}/libclang.dylib" ]; then
            prefix="$(brew --prefix llvm 2>/dev/null || true)"
            if [ -n "${prefix}" ] && [ -e "${prefix}/lib/libclang.dylib" ]; then
              dir="${prefix}/lib"
            fi
          fi
          if [ -e "${dir}/libclang.dylib" ]; then
            echo "LIBCLANG_PATH=${dir}" >> "${GITHUB_ENV}"
            echo "LIBCLANG_PATH=${dir}"
          else
            echo "::warning::libclang.dylib not found, bindgen falls back to its own search"
          fi

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Build
        run: cargo build --verbose --locked

      # `cargo llvm-cov` is the Rust side of the same LLVM coverage that the C++ DynXX uses: it
      # runs the tests, writes the coverage HTML to `coverage/`, and the log that `xtask
      # test-report` renders as the unit test report.
      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          cargo llvm-cov --locked --html --output-dir coverage 2>&1 | tee test-output.txt
          cargo llvm-cov report --lcov --output-path coverage/lcov.info
          cargo xtask test-report --input test-output.txt --output test-report.html

      # What people download from a run: the release static library and the qjsc compiler.
      - name: Build release artifacts
        run: cargo build --release --verbose --locked

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macOS-Mac-build
          path: |
            target/release/libdynrs.a
            target/release/qjsc
          if-no-files-found: error

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: macOS-Mac-reports
          path: |
            coverage/
            test-report.html
          if-no-files-found: error
