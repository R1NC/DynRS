name: CI-OHOS-Ubuntu

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/CI-OHOS-Ubuntu.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/CI-OHOS-Ubuntu.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  OHOS_SDK_VERSION: 26.0.0.38

# OpenHarmony, arm64-v8a, static library only, on one Ubuntu host. DynXX's OHOS build ships the
# same single ABI, and its tests cannot run for the target either. The network module links the
# OpenSSL that comes with the SDK.
#
# The SDK is the public HarmonyOS one, from the same mirror DynXX uses, and it is cached so only
# the first run pays for the download.

jobs:
  ohos:
    name: ohos (arm64-v8a)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-ohos

      - name: Detect libclang path
        shell: bash
        run: |
          set -euo pipefail
          dir="$(llvm-config --libdir 2>/dev/null || true)"
          if [ -z "${dir}" ] || [ ! -e "${dir}/libclang.so" ]; then
            dir="$(ls -d /usr/lib/llvm-*/lib 2>/dev/null | sort -V | tail -n1 || true)"
          fi
          if [ -n "${dir}" ] && [ -e "${dir}/libclang.so" ]; then
            echo "LIBCLANG_PATH=${dir}" >> "${GITHUB_ENV}"
            echo "LIBCLANG_PATH=${dir}"
          else
            echo "::warning::libclang.so not found, bindgen falls back to its own search"
          fi

      - name: Cache HarmonyOS SDK
        id: cache-ohos-sdk
        uses: actions/cache@v4
        with:
          path: ohos-sdk/linux/native
          key: ohos-sdk-linux-${{ env.OHOS_SDK_VERSION }}-${{ runner.os }}
          restore-keys: |
            ohos-sdk-linux-${{ env.OHOS_SDK_VERSION }}-

      - name: Setup HarmonyOS SDK
        if: steps.cache-ohos-sdk.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o ohos-sdk.tar.gz \
            "https://mirrors.huaweicloud.com/harmonyos/os/7.0-Release/ohos-sdk-windows_linux-public_20260829.tar.gz"
          tar -xzf ohos-sdk.tar.gz
          rm ohos-sdk.tar.gz
          cd ohos-sdk/linux
          unzip -q "native-linux-x64-${OHOS_SDK_VERSION}-Release.zip"

      # The vendored C and the vendored OpenSSL are compiled with the OHOS clang against the sysroot
      # of the SDK, so the toolchain is located here instead of being hard coded: the SDK packages
      # do not always unpack into the same directory names, and their `clang` is a symlink. The
      # layout is printed so that a wrong assumption is visible in the log.
      - name: Locate the HarmonyOS toolchain
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${GITHUB_WORKSPACE}/ohos-sdk/linux"
          echo "--- SDK layout ---"
          find "${sdk_root}" -maxdepth 3 -type d | sort | head -n 40

          llvm_ar="$(find "${sdk_root}" -name 'llvm-ar' -print -quit || true)"
          if [ -z "${llvm_ar}" ]; then
            echo "::error::the HarmonyOS toolchain was not found in this SDK"
            exit 1
          fi
          toolchain="$(dirname "${llvm_ar}")"

          clang="${toolchain}/clang"
          if [ ! -e "${clang}" ] && [ ! -L "${clang}" ]; then
            clang="$(find "${toolchain}" -maxdepth 1 -name 'clang-*' -print -quit || true)"
          fi
          if [ -z "${clang}" ] || { [ ! -e "${clang}" ] && [ ! -L "${clang}" ]; }; then
            echo "::error::no clang was found in ${toolchain}"
            exit 1
          fi

          # The sysroot sits next to the toolchain's parent (`<sdk>/native/llvm/bin` under
          # `<sdk>/native/sysroot`), and it has also been called `sysroot_lite` in some packages,
          # so the one that carries the C headers wins.
          native_root="$(dirname "$(dirname "${toolchain}")")"
          sysroot=""
          for candidate in "${native_root}/sysroot" "${native_root}/sysroot_lite"; do
            if [ -f "${candidate}/usr/include/stdio.h" ]; then
              sysroot="${candidate}"
              break
            fi
          done
          if [ -z "${sysroot}" ]; then
            sysroot="$(find "${sdk_root}" -maxdepth 6 -type d -name 'sysroot*' -print -quit || true)"
          fi
          if [ -z "${sysroot}" ]; then
            echo "::error::no sysroot was found in this SDK"
            exit 1
          fi
          echo "clang:   ${clang}"
          echo "llvm-ar: ${llvm_ar}"
          echo "sysroot: ${sysroot}"

          {
            echo "OHOS_TOOLCHAIN=${toolchain}"
            echo "OHOS_SYSROOT=${sysroot}"
          } >> "${GITHUB_ENV}"

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-ohos-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-ohos-cargo-

      # The OHOS clang compiles the vendored C (SQLite, Lua, QuickJS, zlib) and the vendored OpenSSL
      # against the sysroot of the SDK, and its llvm-ar is what archives the result. The manifest
      # declares a static library, so nothing gets linked against the OHOS libraries here.
      - name: Build the static library
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${OHOS_TOOLCHAIN}:${PATH}"
          export CC_aarch64_unknown_linux_ohos="${OHOS_TOOLCHAIN}/clang"
          export AR_aarch64_unknown_linux_ohos="${OHOS_TOOLCHAIN}/llvm-ar"
          # OpenSSL's build indexes its archives with ranlib, which the LLVM toolchain calls
          # `llvm-ranlib`.
          ranlib="${OHOS_TOOLCHAIN}/llvm-ranlib"
          [ -e "${ranlib}" ] || ranlib="${OHOS_TOOLCHAIN}/ranlib"
          export RANLIB_aarch64_unknown_linux_ohos="${ranlib}"
          export CFLAGS_aarch64_unknown_linux_ohos="--target=aarch64-linux-ohos --sysroot=${OHOS_SYSROOT}"
          export BINDGEN_EXTRA_CLANG_ARGS_aarch64_unknown_linux_ohos="--target=aarch64-linux-ohos --sysroot=${OHOS_SYSROOT}"
          # `.cargo/config.toml` has a section for this target too (its `${env.…}` is not expanded),
          # so the environment - which takes precedence - is what supplies these.
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_OHOS_LINKER="${OHOS_TOOLCHAIN}/clang"
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_OHOS_AR="${OHOS_TOOLCHAIN}/llvm-ar"
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_OHOS_RUSTFLAGS=""
          cargo build --release --lib --locked --target aarch64-unknown-linux-ohos

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OHOS-arm64-v8a-build
          path: target/aarch64-unknown-linux-ohos/release/libdynrs.a
          if-no-files-found: error
