name: Common

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rustfmt.toml'
      - 'deny.toml'
      - '.github/workflows/Common.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rustfmt.toml'
      - 'deny.toml'
      - '.github/workflows/Common.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Checks that have nothing to do with a specific host. The source has no platform conditional
# compilation (only `cfg(test)`), so one host is enough to cover all of it.

jobs:
  format:
    name: format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Detect libclang path
        shell: bash
        run: |
          set -euo pipefail
          dir="$(llvm-config --libdir 2>/dev/null || true)"
          if [ -z "${dir}" ] || [ ! -e "${dir}/libclang.so" ]; then
            dir="$(ls -d /usr/lib/llvm-*/lib 2>/dev/null | sort -V | tail -n1 || true)"
          fi
          if [ -n "${dir}" ] && [ -e "${dir}/libclang.so" ]; then
            echo "LIBCLANG_PATH=${dir}" >> "${GITHUB_ENV}"
            echo "LIBCLANG_PATH=${dir}"
          else
            echo "::warning::libclang.so not found, bindgen falls back to its own search"
          fi

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

  deny:
    name: deny
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Advisories, licenses, bans and sources, from the policy in deny.toml. The one advisory
      # without an upstream fix (RUSTSEC-2023-0071) is ignored there with its reason.
      - name: Check dependencies
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --locked
