name: CI-Windows-Win

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'rust-toolchain.toml'
      - '.github/workflows/CI-Windows-Win.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'rust-toolchain.toml'
      - '.github/workflows/CI-Windows-Win.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Detect libclang path
        shell: pwsh
        run: |
          $libclang = (where.exe libclang.dll | Select-Object -First 1).Trim()
          if (-not $libclang) {
            throw "libclang.dll not found on PATH"
          }
          $dir = Split-Path -Parent $libclang
          "LIBCLANG_PATH=$dir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "LIBCLANG_PATH=$dir"

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Build
        run: cargo build --verbose --locked

      # `cargo llvm-cov` is the Rust side of the same LLVM coverage that the C++ DynXX uses: it
      # runs the tests, writes the coverage HTML to `coverage/`, and the log that `xtask
      # test-report` renders as the unit test report.
      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          cargo llvm-cov --locked --html --output-dir coverage 2>&1 | tee test-output.txt
          cargo llvm-cov report --lcov --output-path coverage/lcov.info
          cargo xtask test-report --input test-output.txt --output test-report.html

      # What people download from a run: the release static library and the qjsc compiler.
      - name: Build release artifacts
        run: cargo build --release --verbose --locked

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Win-build
          path: |
            target/release/dynrs.lib
            target/release/qjsc.exe
          if-no-files-found: error

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Win-reports
          path: |
            coverage/
            test-report.html
          if-no-files-found: error
