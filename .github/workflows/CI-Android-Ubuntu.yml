name: CI-Android-Ubuntu

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'xtask/**'
      - '.github/workflows/CI-Android-Ubuntu.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'xtask/**'
      - '.github/workflows/CI-Android-Ubuntu.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# One Ubuntu host, the arm64-v8a ABI, library only: the tests of this crate run on the host, so
# this target is a build check (the same shape as DynXX's Android workflow).

jobs:
  android:
    name: android (arm64-v8a)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Detect libclang path
        shell: bash
        run: |
          set -euo pipefail
          dir="$(llvm-config --libdir 2>/dev/null || true)"
          if [ -z "${dir}" ] || [ ! -e "${dir}/libclang.so" ]; then
            dir="$(ls -d /usr/lib/llvm-*/lib 2>/dev/null | sort -V | tail -n1 || true)"
          fi
          if [ -n "${dir}" ] && [ -e "${dir}/libclang.so" ]; then
            echo "LIBCLANG_PATH=${dir}" >> "${GITHUB_ENV}"
            echo "LIBCLANG_PATH=${dir}"
          else
            echo "::warning::libclang.so not found, bindgen falls back to its own search"
          fi

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-android-arm64-v8a-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-android-arm64-v8a-cargo-

      # The NDK - whichever one the runner image ships - and the compiler settings the vendored C
      # and OpenSSL need are found by the build helper; see `xtask/src/android.rs`.
      - name: Build
        run: cargo xtask build --target android --release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Android-arm64-v8a-build
          path: target/aarch64-linux-android/release/libdynrs.a
          if-no-files-found: error
