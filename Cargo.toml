[package]
name = "dynrs"
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace]
# The cross builds live in `xtask` (`cargo xtask build --target ohos`). It stays out of the default
# members, so that a plain `cargo build` is still what it was: the library and the `qjsc` tool.
members = ["xtask"]
default-members = ["."]

[lib]
name = "dynrs"
# The C ABI is shipped as a static library. The wasm workflow asks for a cdylib on the command
# line instead, because a `.wasm` module is one.
crate-type = ["staticlib"]

[[bin]]
name = "qjsc"
path = "src/bin/qjsc.rs"

[dependencies]
libc = "0.2.171"
once_cell = "1.21.3"
serde_json = "1.0"
futures = "0.3"
redb = "2.4.0"
rusqlite = { version = "0.31.0", features = ["bundled"] }
hex = "0.4.3"
block-modes = "0.8.1"
aes = "0.7.5"
# 0.9.10 is the first release without the panicking key parsing (CVE-2026-21895); the crate has no
# fix for the Marvin timing sidechannel (CVE-2023-49092), so that one stays open on purpose.
rsa = "0.9.10"
rand = "0.9.0"
md5 = { package = "md-5", version = "0.10" }
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22.1"
flate2 = { version = "1.0", features = ["zlib"] }
mlua = { version = "0.9.9", features = ["lua54", "vendored"] }
libquickjs-ng-sys = "0.8"
aes-gcm = "0.11.1"

# The network module needs a socket stack and a TLS backend, neither of which wasm has. DynXX
# leaves curl out of its Emscripten build for the same reason.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.12", features = ["json", "stream", "native-tls", "multipart"] }
tokio = { version = "1.0", features = ["full"] }

# `native-tls` reaches for OpenSSL on Android and HarmonyOS, and neither SDK ships it for linking:
# the NDK has no headers or import libraries, and the HarmonyOS one has no `openssl/ssl.h` and no
# `libssl` whatsoever. It is therefore built from source here, the way DynXX's vcpkg builds it;
# `openssl-src` knows the OHOS target and configures it as `linux-aarch64`.
[target.'cfg(any(target_os = "android", target_env = "ohos"))'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }
