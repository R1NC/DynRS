[package]
name = "dynrs"
version = "1.0.0"
edition = "2024"
license = "MIT"

[workspace]
# The cross builds live in `xtask` (`cargo xtask build --target ohos`). It stays out of the default
# members, so that a plain `cargo build` is still what it was: the library and the `qjsc` tool.
members = ["xtask"]
default-members = ["."]

[lib]
name = "dynrs"
# The C ABI is shipped as a static library. The wasm workflow asks for a cdylib on the command
# line instead, because a `.wasm` module is one.
crate-type = ["staticlib"]

[[bin]]
name = "qjsc"
path = "src/bin/qjsc.rs"

[dependencies]
libc = "0.2.189"
serde_json = "1.0.151"
futures = "0.3.34"
# 3.0 dropped the v2 file format and 4.x only reads v3, so a store written by 2.x no longer opens.
# Nothing released has one yet. It is also what sets the Rust 1.90 floor.
redb = "4.3.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
hex = "0.4.3"
ecb = { version = "0.2.1", features = ["alloc"] }
# `block-modes` is deprecated by RustCrypto in favour of `ecb`/`cbc`; 0.9 is the line that pairs
# with the `aes` 0.9 that `aes-gcm` already pulls in, so both use one copy of the cipher crates.
aes = "0.9.3"
# 0.9.10 is the first release without the panicking key parsing (CVE-2026-21895); the crate has no
# fix for the Marvin timing sidechannel (CVE-2023-49092), so that one stays open on purpose.
rsa = "0.9.10"
rand = "0.10.2"
# `rsa` 0.9 brings `digest` 0.10 in, so these three stay on that line: 0.11 would give a `Digest`
# trait that the RSA paddings are not implemented for. Move them together with `rsa`.
md5 = { package = "md-5", version = "0.10.6" }
sha1 = "0.10.7"
sha2 = "0.10.9"
base64 = "0.23.1"
flate2 = { version = "1.1.10", features = ["zlib"] }
mlua = { version = "0.12.1", features = ["lua54", "vendored"] }
libquickjs-ng-sys = "0.13.1"
aes-gcm = "0.11.1"

# The network module needs a socket stack and a TLS backend, neither of which wasm has. DynXX
# leaves curl out of its Emscripten build for the same reason.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# 0.13 makes `rustls` (over `aws-lc-rs`) the default TLS backend, which does not cross compile for
# the mobile targets, so the defaults are turned off and listed back by hand, keeping `native-tls`.
reqwest = { version = "0.13.5", default-features = false, features = [
    "charset",
    "http2",
    "json",
    "multipart",
    "native-tls",
    "stream",
    "system-proxy",
] }
tokio = { version = "1.53.1", features = ["full"] }

# `native-tls` reaches for OpenSSL on Android and HarmonyOS, and neither SDK ships it for linking:
# the NDK has no headers or import libraries, and the HarmonyOS one has no `openssl/ssl.h` and no
# `libssl` whatsoever. It is therefore built from source here, the way DynXX's vcpkg builds it;
# `openssl-src` knows the OHOS target and configures it as `linux-aarch64`.
[target.'cfg(any(target_os = "android", target_env = "ohos"))'.dependencies]
openssl = { version = "0.10.81", features = ["vendored"] }
